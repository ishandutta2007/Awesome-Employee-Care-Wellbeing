<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.7" />
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>
  </defs>

  <style>
    .bg-circle-1 {
      animation: float1 10s ease-in-out infinite alternate;
    }
    .bg-circle-2 {
      animation: float2 12s ease-in-out infinite alternate;
    }
    .pulse-line {
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: dash 5s linear infinite;
    }
    .floating-pill {
      animation: floatPill 6s ease-in-out infinite alternate;
    }
    .floating-pill-2 {
      animation: floatPill2 7s ease-in-out infinite alternate;
    }
    .floating-pill-3 {
      animation: floatPill3 8s ease-in-out infinite alternate;
    }
    .glow-dot {
      animation: blink 2.5s ease-in-out infinite;
    }

    @keyframes dash {
      0% { stroke-dashoffset: 800; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -800; }
    }
    @keyframes float1 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(40px, -25px) scale(1.15); }
    }
    @keyframes float2 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-35px, 20px) scale(1.12); }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
    @keyframes floatPill2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(14px); }
    }
    @keyframes floatPill3 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="18" fill="url(#bgGrad)" />

  <!-- Subtle Grid Accent -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Ambient Dynamic Orbs (Behind content) -->
  <circle class="bg-circle-1" cx="180" cy="110" r="130" fill="#38bdf8" opacity="0.18" filter="url(#softGlow)" />
  <circle class="bg-circle-2" cx="1020" cy="240" r="140" fill="#ec4899" opacity="0.16" filter="url(#softGlow)" />
  <circle class="bg-circle-1" cx="620" cy="300" r="120" fill="#6366f1" opacity="0.12" filter="url(#softGlow)" />

  <!-- Dynamic ECG / Care Wellbeing Waveform in Background -->
  <path class="pulse-line" d="M 0 310 Q 150 310 260 310 L 290 280 L 310 335 L 340 230 L 370 350 L 400 310 L 520 310 Q 640 310 720 310 L 750 270 L 775 340 L 805 220 L 835 345 L 865 310 L 1200 310" 
        fill="none" stroke="url(#pulseGrad)" stroke-width="2.5" opacity="0.45" filter="url(#glow)" />

  <!-- Animated Floating Category Tags / Interactive Aesthetic Badges -->
  <g class="floating-pill" opacity="0.85">
    <rect x="75" y="45" width="165" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.85" />
    <circle cx="93" cy="62" r="5" fill="#38bdf8" class="glow-dot" />
    <text x="108" y="68" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">🧠 Mental Health</text>
  </g>

  <g class="floating-pill-2" opacity="0.85">
    <rect x="960" y="50" width="165" height="34" rx="17" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" opacity="0.85" />
    <circle cx="978" cy="67" r="5" fill="#ec4899" class="glow-dot" />
    <text x="993" y="73" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">❤️ Wellness Care</text>
  </g>

  <g class="floating-pill-3" opacity="0.85">
    <rect x="880" y="110" width="180" height="34" rx="17" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" opacity="0.85" />
    <circle cx="898" cy="127" r="5" fill="#a78bfa" class="glow-dot" />
    <text x="913" y="133" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">🔥 Burnout Shield</text>
  </g>

  <g class="floating-pill" opacity="0.85">
    <rect x="140" y="110" width="175" height="34" rx="17" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.85" />
    <circle cx="158" cy="127" r="5" fill="#34d399" class="glow-dot" />
    <text x="173" y="133" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">⚡ Open Source &amp; SaaS</text>
  </g>

  <!-- Foreground Main Branding & Typography -->
  <g text-anchor="middle">
    <!-- Super-header Badge -->
    <rect x="475" y="60" width="250" height="28" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
    <text x="600" y="79" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">CURATED AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="152" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">Awesome Employee Care &amp; Wellbeing</text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="196" fill="url(#subGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" letter-spacing="0.2">
      Empowering Workplace Mental Health, Corporate Wellness, Stress Prevention &amp; People Care
    </text>

    <!-- Feature Indicators in Center-bottom -->
    <g transform="translate(390, 230)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="65" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">📊 Pricing &amp; Sizing</text>

      <!-- Badge 2 -->
      <rect x="145" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="210" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">⭐ GitHub Stars</text>

      <!-- Badge 3 -->
      <rect x="290" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="355" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">🛡️ Privacy-First</text>
    </g>
  </g>
</svg>
