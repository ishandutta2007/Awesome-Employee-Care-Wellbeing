<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="subGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient><linearGradient id="pulseGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".7"/><stop offset="50%" stop-color="#8b5cf6" stop-opacity=".7"/><stop offset="100%" stop-color="#f43f5e" stop-opacity=".7"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softGlow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="25"/></filter></defs><style>@keyframes dash{0%{stroke-dashoffset:800}50%{stroke-dashoffset:0}}@keyframes float1{0%{transform:translate(0,0) scale(1)}}@keyframes float2{0%{transform:translate(0,0) scale(1)}}@keyframes floatPill{0%{transform:translateY(0)}}@keyframes floatPill2{0%{transform:translateY(0)}}@keyframes floatPill3{0%{transform:translateY(0)}}@keyframes blink{0%{opacity:.3;transform:scale(.9)}50%{opacity:.9;transform:scale(1.2)}}.bg-circle-1{animation:float1 10s ease-in-out infinite alternate}.bg-circle-2{animation:float2 12s ease-in-out infinite alternate}.pulse-line{stroke-dasharray:800;stroke-dashoffset:800;animation:dash 5s linear infinite}.floating-pill{animation:floatPill 6s ease-in-out infinite alternate}.floating-pill-2{animation:floatPill2 7s ease-in-out infinite alternate}.floating-pill-3{animation:floatPill3 8s ease-in-out infinite alternate}.glow-dot{animation:blink 2.5s ease-in-out infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="18"/><g stroke="#fff" stroke-width="1" opacity=".08"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="200" x2="200" y1="0" y2="360"/><line x1="400" x2="400" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="800" x2="800" y1="0" y2="360"/><line x1="1000" x2="1000" y1="0" y2="360"/></g><circle cx="180" cy="110" r="130" fill="#38bdf8" class="bg-circle-1" filter="url(#softGlow)" opacity=".18"/><circle cx="1020" cy="240" r="140" fill="#ec4899" class="bg-circle-2" filter="url(#softGlow)" opacity=".16"/><circle cx="620" cy="300" r="120" fill="#6366f1" class="bg-circle-1" filter="url(#softGlow)" opacity=".12"/><path fill="none" stroke="url(#pulseGrad)" stroke-width="2.5" d="M 0 310 Q 150 310 260 310 L 290 280 L 310 335 L 340 230 L 370 350 L 400 310 L 520 310 Q 640 310 720 310 L 750 270 L 775 340 L 805 220 L 835 345 L 865 310 L 1200 310" class="pulse-line" filter="url(#glow)" opacity=".45"/><g class="floating-pill" opacity=".85"><rect width="165" height="34" x="75" y="45" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity=".85" rx="17"/><circle cx="93" cy="62" r="5" fill="#38bdf8" class="glow-dot"/><text x="108" y="68" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">🧠 Mental Health</text></g><g class="floating-pill-2" opacity=".85"><rect width="165" height="34" x="960" y="50" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" opacity=".85" rx="17"/><circle cx="978" cy="67" r="5" fill="#ec4899" class="glow-dot"/><text x="993" y="73" fill="#e2e8f0" font-family="-apple